<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe Book</title>
<style>
  /* Layout idea: one column, thumb-first. Picker -> recipe -> tabbed panes. */
  :root {
    --bg:        #fbfaf5;
    --surface:   #ffffff;
    --ink:       #1a1c19;
    --muted:     #6b6f68;
    --line:      #dcded4;
    --accent:    #2f6f33;
    --accent-bg: #e9f1e7;
    --display: Georgia, "Times New Roman", serif;   /* system only: the publish gate refuses third-party fonts */
    --body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --r: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #131510;
      --surface:   #1c1f19;
      --ink:       #ecefe6;
      --muted:     #9aa193;
      --line:      #2f3429;
      --accent:    #8cc98c;
      --accent-bg: #222b20;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:        #131510;
    --surface:   #1c1f19;
    --ink:       #ecefe6;
    --muted:     #9aa193;
    --line:      #2f3429;
    --accent:    #8cc98c;
    --accent-bg: #222b20;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 56px; }

  /* ---------- header ---------- */
  header { padding: 22px 0 14px; }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.6rem;
    letter-spacing: -0.015em;
    margin: 0;
    text-wrap: balance;
  }
  .sub { color: var(--muted); font-size: 0.86rem; margin: 4px 0 0; }

  /* ---------- recipe list ---------- */
  .list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .card {
    display: block; width: 100%; text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 14px 15px;
    color: inherit; font: inherit; cursor: pointer;
    border-left: 4px solid var(--accent);
  }
  .card:active { transform: scale(0.995); }
  .card h2 {
    font-family: var(--display); font-weight: 700;
    font-size: 1.1rem; margin: 0 0 3px; letter-spacing: -0.01em;
  }
  .card p { margin: 0; font-size: 0.87rem; color: var(--muted); }
  .card .meta {
    margin-top: 7px; font-size: 0.74rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.07em;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- recipe view ---------- */
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 0; padding: 14px 0 2px; margin: 0;
    color: var(--accent); font: inherit; font-size: 0.88rem;
    font-weight: 500; cursor: pointer;
  }
  .rmeta {
    display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0;
  }
  .pill {
    font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase;
    background: var(--accent-bg); color: var(--accent);
    border-radius: 999px; padding: 4px 10px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .tabs {
    display: flex; gap: 4px; margin: 16px 0 0;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 4px;
    position: sticky; top: 8px; z-index: 5;
  }
  .tab {
    flex: 1; border: 0; background: none; color: var(--muted);
    font: inherit; font-size: 0.85rem; font-weight: 500;
    padding: 9px 4px; border-radius: 7px; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .pane { margin-top: 16px; }

  /* ---------- prep banner ---------- */
  .prep {
    background: var(--accent-bg); border-radius: var(--r);
    padding: 12px 14px; margin-bottom: 14px;
  }
  .prep h3 {
    margin: 0 0 7px; font-size: 0.72rem; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--accent); font-weight: 600;
  }
  .prep ul { margin: 0; padding-left: 17px; }
  .prep li { font-size: 0.89rem; margin-bottom: 5px; }
  .prep li:last-child { margin-bottom: 0; }

  /* ---------- steps ---------- */
  .steps { display: flex; flex-direction: column; gap: 9px; }
  .step {
    display: flex; gap: 12px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 13px 14px;
    color: inherit; font: inherit; cursor: pointer;
  }
  .step.done { opacity: 0.45; }
  .step.done .act { text-decoration: line-through; }
  .num {
    flex: 0 0 26px; height: 26px; border-radius: 50%;
    background: var(--accent-bg); color: var(--accent);
    display: grid; place-items: center;
    font-size: 0.8rem; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .step.done .num { background: var(--accent); color: var(--surface); }
  .act { font-size: 1rem; line-height: 1.4; }
  .uses { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .use {
    font-size: 0.78rem; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 7px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- ingredients ---------- */
  .ings { display: flex; flex-direction: column; gap: 0; }
  .ing {
    display: flex; gap: 11px; align-items: flex-start; width: 100%;
    text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--line);
    padding: 12px 2px; color: inherit; font: inherit; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .box {
    flex: 0 0 19px; height: 19px; margin-top: 2px;
    border: 1.5px solid var(--line); border-radius: 5px;
  }
  .ing.got .box { background: var(--accent); border-color: var(--accent); }
  .ing.got span { opacity: 0.42; text-decoration: line-through; }

  /* ---------- grid ---------- */
  .scroller {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line); border-radius: var(--r);
    background: var(--surface);
  }
  table { border-collapse: collapse; font-size: 0.78rem; }
  td {
    border: 1px solid var(--line); padding: 7px 9px;
    vertical-align: middle; white-space: pre-line;
  }
  td.gi {
    position: sticky; left: 0; z-index: 2;
    background: var(--surface); min-width: 170px; max-width: 170px;
    font-variant-numeric: tabular-nums;
    border-right: 2px solid var(--line);
  }
  td.gs { text-align: center; font-weight: 600; min-width: 108px; }
  .hint { font-size: 0.78rem; color: var(--muted); margin: 8px 2px 0; }

  /* ---------- notes ---------- */
  .notes { display: flex; flex-direction: column; gap: 11px; }
  .note {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 12px 14px;
    font-size: 0.9rem; line-height: 1.55;
  }
  .note b {
    display: block; font-size: 0.72rem; letter-spacing: 0.08em;
    color: var(--accent); margin-bottom: 4px; font-weight: 600;
  }

  .tools { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .tool {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; color: var(--muted);
    font: inherit; font-size: 0.82rem; cursor: pointer;
  }
  .tool[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

{"recipes": [{"name": "Smash Burgers", "category": "Beef / griddle", "serves": 2, "blurb": "Oklahoma onion, double-stacked 2 oz patties.", "subtitle": "Double-stacked 2 oz patties, smashed through paper-thin onion. Makes 2 burgers.", "prep": ["Slice onion paper-thin — mandoline if you have one", "Divide beef into four loose 2 oz (55 g) balls; keep cold, do NOT season", "Heat cast iron or carbon steel over high until it just smokes"], "ingredients": ["1 tsp (5 mL) neutral oil", "8 oz (225 g) ground chuck, 80/20, cold", "1/2 medium yellow onion, sliced paper-thin", "1/2 tsp (3 g) kosher salt", "1/4 tsp (0.5 g) black pepper", "2 slices American cheese", "2 soft potato or sesame buns", "2 Tbs (30 mL) burger sauce", "4 dill pickle slices"], "steps": ["Slice the onion paper-thin and pile it loose. Divide the 8 oz of chuck into four 2 oz balls, handling them as little as possible, and keep them cold. Do not season yet.", "Heat a cast iron or carbon steel pan over medium-high. Toast the cut sides of the buns until golden, then set them aside.", "Crank the heat to high. Add 1 tsp oil and wipe out the excess with a paper towel. Heat until the pan just starts to smoke.", "Place the four balls in the pan with room between them. Immediately top each with a handful of onion, then smash hard straight through the onion with a stiff spatula until each patty is about 1/8 in thick.", "Season the onion side with the 1/2 tsp salt and 1/4 tsp pepper.", "Sear undisturbed about 90 seconds, until the edges are lacy and deep brown.", "Scrape hard to get fully under the crust and flip, onion side down. Lay a slice of American cheese on two of the four patties.", "Cook 30 to 45 seconds, just until the cheese melts. Pull them promptly — thin patties overcook fast.", "Spread burger sauce on the bun bottoms, add the pickles, then stack two patties per bun. Serve immediately."], "grid": [{"ing": "1 tsp (5 mL) neutral oil", "cells": [{"span": 1, "text": "wipe into\nhot pan"}, {"span": 1, "text": "" notes": ["The paste is the binder. Salting the puréed third and working it hard dissolves myosin into a sticky sol — that is what holds the patty together and gives it the springy bounce of a shrimp ball. The egg and cornstarch are insurance, not the structure.", "Do not purée more than a third or you lose the diced bite entirely and end up with a shrimp cake.", "Water is the enemy. Frozen shrimp are usually phosphate-treated and hold a lot of it — press between towels harder than feels reasonable, and pat the formed patty dry again right before it hits the pan.", "The 30-minute chill is not optional. A warm patty falls apart on the flip.", "Do not smash these. Shrimp is lean and wet; smashing squeezes out moisture, sticks to the pan, and tears on the flip. A formed 3/4 in patty in a shallow film of oil is the move.", "Pull at 120–125°F and let carryover finish it. Shrimp goes from perfect to rubber in about 20 seconds.", "Use a wide fish spatula and flip once, decisively.", "Lime goes on at the plate, never in the mix — acid starts curing raw shrimp and turns the texture chalky.", "Low-sodium swap: 1 tsp fish sauce in place of half the kosher salt buys more flavor per mg of sodium.", "Egg white only (skip the yolk) makes a slightly drier, firmer patty if the mix feels loose."]}, {"name": "Swai Fillets", "category": "Seafood / pan-fry", "serves": 4, "blurb": "Cornmeal crust, chilled, then fried and finished covered.", "subtitle": "Cornmeal crust, chilled, then pan-fried and finished covered. Serves 4. Prep 10 min / chill 30 min / cook 20 min.", "prep": ["Pat the fillets dry before seasoning", "Set up two shallow bowls: spice mix and cornmeal"], "ingredients": ["2 tsp red pepper flakes", "1 tsp seafood seasoning (Old Bay or similar)", "1 tsp garlic powder", "salt and ground black pepper, to taste", "1 cup (160 g) cornmeal", "4 fillets swai, 4 oz (115 g) each", "2 Tbs (30 mL) canola oil", "1/4 cup (60 mL) water"], "steps": ["Pat the fillets dry. Combine the red pepper flakes, seafood seasoning, garlic powder, salt and pepper in a bowl, and spread the cornmeal in a second shallow bowl.", "Season the fish with the spice mix, then press each fillet into the cornmeal to coat.", "Wrap the coated fillets in plastic and refrigerate 30 minutes. This sets the coating so it does not slide off in the pan.", "Heat the 2 Tbs of canola oil in a skillet over medium.", "Fry about 5 minutes per side, until browned.", "Add the 1/4 cup of water, bring to a simmer, cover, and cook about 10 minutes, flipping occasionally, until the fish flakes. Read the notes first — this last step undoes the crust, and the fish is done well before 20 minutes of total heat."], "grid": [{"ing": "2 tsp red pepper flakes", "cells": [{"span": 4, "text": "combine\nin a bowl"}, {"span": 6, "text": "season the fish\nwith the spice mix,\nthen press into\nthe cornmeal\nto coat"}, {"span": 6, "text": "wrap in\nplastic\n\nchill\n30 min"}, {"span": 7, "text": "fry in the\nhot oil\n\n~5 min\nper side,\nuntil browned"}, {"span": 8, "text": "add water\n\nsimmer covered\n~10 min,\nflipping,\nuntil it flakes"}, {"span": 1, "text": ""}]}, {"ing": "1 tsp seafood seasoning (Old Bay or similar)", "cells": [null, null, null, null, null, {"span": 1, "text": ""}]}, {"ing": "1 tsp garlic powder", "cells": [null, null, null, null, null, {"span": 1, "text": ""}]}, {"ing": "salt and ground black pepper, to taste", "cells": [null, null, null, null, null, {"span": 1, "text": ""}]}, {"ing": "1 cup (160 g) cornmeal", "cells": [{"span": 1, "text": "spread in a\nshallow bowl"}, null, null, null, null, {"span": 1, "text": ""}]}, {"ing": "4 fillets swai, 4 oz (115 g) each", "cells": [{"span": 1, "text": ""}, null, null, null, null, {"span": 1, "text": ""}]}, {"ing": "2 Tbs (30 mL) canola oil", "cells": [{"span": 1, "text": "heat in skillet,\nmedium"}, {"span": 1, "text": ""}, {"span": 1, "text": ""}, null, null, {"span": 1, "text": ""}]}, {"ing": "1/4 cup (60 mL) water", "cells": [{"span": 1, "text": ""}, {"span": 1, "text": ""}, {"span": 1, "text": ""}, {"span": 1, "text": ""}, null, {"span": 1, "text": ""}]}], "ncols": 6, "notes": ["Source: recipe by Bonnie M Goodwin, published on Allrecipes. Transcribed as written — the notes below are changes to consider, not changes I made.", "The covered water-simmer will undo the crust you just built. Steam softens cornmeal fast. If you want the crisp coating the recipe promises, skip the water entirely and just fry to done.", "Swai fillets run thin — often well under 3/4 in. Five minutes a side plus ten minutes covered is far more heat than they need; that is 20 minutes of cooking on a fish that is done in six to eight. Fry 3–4 min per side and pull at 140°F.", "The 30-minute chill is doing real work here: it sets the coating so it does not slide off in the pan. Keep that step.", "2 tsp red pepper flakes across four fillets is assertive. Halve it on the first run if serving anyone heat-shy.", "Old Bay is roughly 300 mg sodium per 1/4 tsp. Salt-free Old Bay exists, or use the celery-seed / dry-mustard / paprika profile without the salt and season the fish directly.", "Cornmeal browns better than flour but burns faster. Medium heat, not medium-high, and wipe the pan between batches.", "Swai is farmed pangasius and quite mild and soft. Catfish, tilapia, or basa all drop into this recipe unchanged."]}, {"name": "Shrimp & Egg Noodles", "category": "Seafood / pasta", "serves": 2, "blurb": "Buttery garlic-Parmesan pan sauce; stock + vinegar in place of wine.", "subtitle": "Buttery garlic-Parmesan pan sauce, no wine. Serves 2. About 25 minutes.", "prep": ["Start the noodles first — their water is an ingredient here, not a byproduct", "Pat the shrimp bone-dry and grate the Parmesan fine (Microplane, not shreds)", "Have everything cut and within reach — the sauce comes together in under 5 minutes"], "ingredients": ["12 oz (340 g) large shrimp, peeled, patted bone-dry", "1/2 tsp (3 g) kosher salt", "1/4 tsp (0.5 g) black pepper", "1 Tbs (15 g) butter, for the pan", "4 cloves garlic, thinly sliced", "1/4 tsp red pepper flakes", "2 tsp (10 mL) white wine vinegar", "1/2 cup (120 mL) reserved noodle water — or unsalted stock", "2 qt (2 L) water + 2 tsp (6 g) kosher salt — less water than usual, on purpose", "8 oz (225 g) wide egg noodles", "1 cup (240 mL) reserved noodle water — scoop extra", "3 Tbs (45 g) cold unsalted butter, cubed", "1 oz (30 g) Parmigiano-Reggiano, grated fine", "1 Tbs (15 mL) lemon juice", "2 Tbs (8 g) flat-leaf parsley, chopped"], "steps": ["Put 2 qt of water on to boil with the 2 tsp of kosher salt. Its starch is an ingredient here, so start it first.", "While it heats, get everything ready: pat the shrimp bone-dry and season with the salt and pepper, slice the garlic, cube the butter and keep it cold, grate the Parmesan fine, chop the parsley, juice the lemon.", "When the water boils, add the egg noodles and cook them 1 minute under package time.", "While the noodles cook, melt the 1 Tbs of butter in a skillet over medium-high. Sear the shrimp 90 seconds per side, then remove them to a plate.", "In the same pan, add the garlic and red pepper flakes. Sizzle 45 seconds, until fragrant but not browned.", "Scoop out 1 cup of the noodle water, then drain the noodles.", "Add the vinegar and 1/2 cup of the noodle water to the pan. Reduce by half, scraping up the fond.", "Add the drained noodles and a splash more noodle water. Toss over low heat.", "Take the pan OFF the heat. Add the cold butter and the Parmesan in handfuls, tossing constantly, until the sauce turns glossy. On direct heat it will break.", "Return the shrimp and add the lemon juice and parsley. Loosen with more noodle water until the sauce coats the noodles. Serve immediately."], "grid": [{"ing": "12 oz (340 g) large shrimp, peeled, patted bone-dry", "cells": [{"span": 3, "text": "season"}, {"span": 4, "text": "sear 90 sec\nper side\n\nremove to\na plate"}, {"span": 11, "text": "add the noodles\nand 1/2 cup\nnoodle water\n\ntoss over\nlow heat"}, {"span": 13, "text": "OFF the heat:\n\nadd the butter and\ncheese in handfuls,\ntossing constantly\nuntil glossy"}, {"span": 15, "text": "return the\nshrimp\n\nadd lemon\nand parsley"}, {"span": 15, "text": "loosen with\nnoodle water\nto a glossy\nsauce\n\nserve\nimmediately"}]}, {"ing": "1/2 tsp (3 g) kosher salt", "cells": [null, null, null, null, null, null]}, {"ing": "1/4 tsp (0.5 g) black pepper", "cells": [null, null, null, null, null, null]}, {"ing": "1 Tbs (15 g) butter, for the pan", "cells": [{"span": 1, "text": "melt in skillet,\nmedium-high"}, null, null, null, null, null]}, {"ing": "4 cloves garlic, thinly sliced", "cells": [{"span": 2, "text": "add to the\nsame pan"}, {"span": 2, "text": "sizzle 45 sec\nuntil fragrant,\nnot browned"}, null, null, null, null]}, {"ing": "1/4 tsp red pepper flakes", "cells": [null, null, null, null, null, null]}, {"ing": "2 tsp (10 mL) white wine vinegar", "cells": [{"span": 2, "text": "pour in"}, {"span": 2, "text": "reduce by half,\nscraping up\nthe fond"}, null, null, null, null]}, {"ing": "1/2 cup (120 mL) reserved noodle water — or unsalted stock", "cells": [null, null, null, null, null, null]}, {"ing": "2 qt (2 L) water + 2 tsp (6 g) kosher salt — less water than usual, on purpose", "cells": [{"span": 2, "text": "boil the noodles\n1 min under\npackage time"}, {"span": 3, "text": ""}, null, null, null, null]}, {"ing": "8 oz (225 g) wide egg noodles", "cells": [null, null, null, null, null, null]}, {"ing": "1 cup (240 mL) reserved noodle water — scoop extra", "cells": [{"span": 1, "text": "scoop out before\ndraining"}, null, null, null, null, null]}, {"ing": "3 Tbs (45 g) cold unsalted butter, cubed", "cells": [{"span": 2, "text": ""}, {"span": 2, "text": ""}, {"span": 2, "text": ""}, null, null, null]}, {"ing": "1 oz (30 g) Parmigiano-Reggiano, grated fine", "cells": [null, null, null, null, null, null]}, {"ing": "1 Tbs (15 mL) lemon juice", "cells": [{"span": 2, "text": ""}, {"span": 2, "text": ""}, {"span": 2, "text": ""}, {"span": 2, "text": ""}, null, null]}, {"ing": "2 Tbs (8 g) flat-leaf parsley, chopped", "cells": [null, null, null, null, null, null]}], "ncols": 6, "notes": ["No wine, no problem — but lemon juice alone is the wrong substitute. Wine brings acid, a little sweetness, and aromatic depth. The stock-plus-vinegar combination covers the body and the acid, cooked down early so the raw vinegar edge burns off, and the lemon goes in at the end for brightness. Dry vermouth is the closest single-bottle stand-in if you ever want to keep one around; it keeps for months in the fridge, unlike wine.", "NO STOCK NEEDED. The half cup of liquid that cooks down with the vinegar is reserved noodle water by default: starchy, already seasoned, and sitting right there. Starch is the thing this sauce is short on, so it is arguably the better choice. Unsalted chicken or shrimp stock buys a little more savory depth if you happen to have it. To close that gap without stock, melt 1/4 tsp mushroom powder or a small squeeze of anchovy paste into the garlic just before the liquid goes in \\u2014 one or the other, not both. If the shrimp were shell-on, simmering the shells in a cup of water for 10 minutes beats chicken stock here outright.", "HOW MUCH WATER: about 2 qt (2 L) for 8 oz of noodles — deliberately less than the usual 4 qt, because the sauce lives on the starch concentration in the reserved water and egg noodles throw little of it to begin with. Boil them in a big pot and the 3/4 cup you scoop out is close to plain water. Salt it lightly, 2 tsp kosher rather than the usual tablespoon: unlike potato water this goes INTO the dish, and an ounce of Parmesan lands on top of it. Taste and finish-season at the end. Stir in the first 30 seconds so they do not clump.", "Egg noodles are the real variable here. They are softer, eggier, and release far less starch than durum pasta, so the usual pasta-water emulsion is weaker. Pull them a full minute under package time, save more water than feels necessary, and expect to work the butter in harder.", "Add the Parmesan off the heat, in handfuls, tossing the whole time. Over direct heat the cheese proteins tighten and the fat breaks out — you get a greasy, stringy pan instead of a sauce.", "Cold butter, cubed, added off heat. Melted butter poured in will not emulsify; cold butter releases its fat slowly enough to stay suspended.", "Shrimp cook in about three minutes total. Sear them first, pull them out, and let them finish in the residual heat of the sauce at the end — anything else overcooks them while the sauce comes together.", "Bone-dry shrimp or no sear. Any surface water steams and you get grey shrimp instead of browned ones.", "Sodium: the Parmesan carries most of it (roughly 400 mg per ounce), so use unsalted stock and go light on the salt in the shrimp seasoning. The cheese, garlic, and fond are the umami early; the lemon is the acid late.", "Scale the butter by what you want. 3 Tbs is restrained; 5 Tbs is the version that tastes like a restaurant made it."]}, {"name": "Sesame Turkey Meatballs", "category": "Poultry / baked", "serves": 2, "blurb": "Maple-ketchup sweet-and-sour sauce; seared, then baked and broiled.", "subtitle": "Maple-ketchup sweet-and-sour sauce, seared then baked. Adapted from Allrecipes. Serves 2. About 50 minutes.", "prep": ["Preheat oven to 350°F (175°C)", "Have an ungreased glass 9x13-in pan and foil ready", "Serve over jasmine rice — start it so it finishes with the bake"], "ingredients": ["1/4 cup (60 mL) real maple syrup", "1/4 cup (60 mL) ketchup", "2 Tbs + 2 tsp (40 mL) rice wine vinegar", "1 Tbs (15 mL) yellow mustard", "1/2 Tbs (5 g) sesame seeds, or more to taste", "2 Tbs (30 mL) sesame oil", "2 Tbs + 2 tsp sliced green onions", "1/2 egg, beaten", "2 Tbs (30 mL) low-sodium soy sauce", "1/2 tsp minced fresh ginger root", "1/4 tsp onion powder", "1/8 tsp ground black pepper", "1/8 tsp garlic powder", "1/2 lb (225 g) ground turkey", "1/4 cup (25 g) panko bread crumbs", "2 Tbs (30 mL) olive oil", "1 cup (130 g) carrots, chopped (optional)"], "steps": ["Preheat the oven to 350°F (175°C). Have an ungreased 9x13 glass pan and foil ready.", "Combine the maple syrup, ketchup, rice vinegar, mustard and sesame seeds in a medium saucepan. Bring to a simmer and simmer 5 minutes.", "Take it off the heat and stir in the sesame oil. Set aside. Simmering sesame oil drives off its aroma, which is the whole reason it is here.", "Beat together the green onions, egg, soy sauce, ginger, onion powder, black pepper and garlic powder.", "Add the ground turkey, top with the panko, and mix well by hand.", "Scoop into uniform meatballs.", "Heat the olive oil in a skillet over medium-high. Sear the meatballs 2 to 3 minutes, turning, until browned on all sides — they will not be cooked through. Transfer them to the baking pan.", "Scatter the chopped carrots evenly between the meatballs.", "Pour the sauce evenly over everything and cover with foil.", "Bake 20 to 25 minutes covered, then uncover and broil 2 to 3 minutes to glaze."], "grid": [{"ing": "1/4 cup (60 mL) real maple syrup", "cells": [{"span": 5, "text": "combine in a\nmedium saucepan"}, {"span": 5, "text": "bring to a simmer\n\nsimmer 5 min"}, {"span": 6, "text": "OFF the heat:\nstir in the\nsesame oil\n\nset aside"}, {"span": 6, "text": ""}, {"span": 17, "text": "pour the sauce\nevenly over\n\ncover with foil"}, {"span": 17, "text": "bake 350°F\n(175°C)\n20–25 min\ncovered\n\nuncover, broil\n2–3 min\nto glaze"}]}, {"ing": "1/4 cup (60 mL) ketchup", "cells": [null, null, null, null, null, null]}, {"ing": "2 Tbs + 2 tsp (40 mL) rice wine vinegar", "cells": [null, null, null, null, null, null]}, {"ing": "1 Tbs (15 mL) yellow mustard", "cells": [null, null, null, null, null, null]}, {"ing": "1/2 Tbs (5 g) sesame seeds, or more to taste", "cells": [null, null, null, null, null, null]}, {"ing": "2 Tbs (30 mL) sesame oil", "cells": [{"span": 1, "text": ""}, {"span": 1, "text": ""}, null, null, null, null]}, {"ing": "2 Tbs + 2 tsp sliced green onions", "cells": [{"span": 7, "text": "beat together\nin a mixing bowl\nuntil well mixed"}, {"span": 9, "text": "mix well\nby hand"}, {"span": 9, "text": "scoop into\nuniform meatballs"}, {"span": 10, "text": "sear 2–3 min,\nturning, until\nbrowned on all\nsides — not\ncooked through\n\ntransfer to\nthe pan"}, null, null]}, {"ing": "1/2 egg, beaten", "cells": [null, null, null, null, null, null]}, {"ing": "2 Tbs (30 mL) low-sodium soy sauce", "cells": [null, null, null, null, null, null]}, {"ing": "1/2 tsp minced fresh ginger root", "cells": [null, null, null, null, null, null]}, {"ing": "1/4 tsp onion powder", "cells": [null, null, null, null, null, null]}, {"ing": "1/8 tsp ground black pepper", "cells": [null, null, null, null, null, null]}, {"ing": "1/8 tsp garlic powder", "cells": [null, null, null, null, null, null]}, {"ing": "1/2 lb (225 g) ground turkey", "cells": [{"span": 2, "text": "add turkey,\ntop with panko"}, null, null, null, null, null]}, {"ing": "1/4 cup (25 g) panko bread crumbs", "cells": [null, null, null, null, null, null]}, {"ing": "2 Tbs (30 mL) olive oil", "cells": [{"span": 1, "text": "heat in a skillet,\nmedium-high"}, {"span": 1, "text": ""}, {"span": 1, "text": ""}, null, null, null]}, {"ing": "1 cup (130 g) carrots, chopped (optional)", "cells": [{"span": 1, "text": "chop"}, {"span": 1, "text": ""}, {"span": 1, "text": ""}, {"span": 1, "text": "scatter evenly\nbetween the\nmeatballs"}, null, null]}], "ncols": 6, "notes": ["Adapted from Allrecipes recipe 270759, Asian Sesame Sweet-and-Sour Turkey Meatballs. Ingredients and amounts are unchanged; the method is not — see the next two notes.", "CHANGED — browning. The original bakes covered 30 min, then uncovered 10. That steams the meatballs; they never brown, and the uncovered stretch is too short and too cool to fix it. The grid above sears them first and finishes under the broiler, with the covered bake cut to 20–25 min because they go in partly cooked.", "CHANGED — where the two oils work. The 2 Tbs of olive oil moved out of the sauce and into the skillet, where it does the searing; the 2 Tbs of sesame oil moved to the end, stirred in off the heat. Nothing was added or removed. Toasted sesame oil's aroma compounds are volatile, so simmering it 5 minutes wastes most of what you bought it for, and 4 Tbs of oil in an unthickened sauce just splits and pools under the foil.", "The odd fractions (1/6 cup, 1/8 cup, 1/2 egg) are artifacts of the site's serving scaler. Converted to spoons above. For the half egg: beat one whole egg and use half, or use the whole egg and add another tablespoon of panko.", "NUTRITION at 2 servings. The site's panel (432 cal / 26 g fat / 35 g carb / 19 g protein) is per serving at 3, so the whole dish is about 1,300 cal, 78 g fat, 105 g carb, 57 g protein. Halved: roughly 650 cal, 39 g fat, 53 g carb, 29 g protein per serving. Add 1 cup cooked jasmine rice and the plate lands near 855 cal, 39 g fat, 98 g carb, 33 g protein.", "SODIUM — yes, this needs adjustment now. Estimated from the ingredients (the panel does not list it): about 2,300 mg across the dish, so roughly 1,150 mg per serving at 2 — up by half from the 3-serving split, for the same food. Two ingredients own nearly all of it: 2 Tbs low-sodium soy at ~1,150 mg and 1/4 cup ketchup at ~600 mg. Everything else together is under 550 mg.", "The rice makes this worse in one specific way. Plain jasmine rice adds no sodium, so it lowers sodium per calorie — but it also means you spoon up every bit of the pooled sauce instead of leaving some in the pan, so you actually eat more of the sodium than you would without it.", "Two fixes, both free on flavor: cut the soy to 1 Tbs and make up the liquid with water (the ginger, green onion and the two powders are carrying that mix, not the salt), and use no-salt-added ketchup. Together that takes the dish from ~2,300 mg to roughly 1,100 — about 550 mg per serving. Cook the rice unsalted and the plate stays there.", "Protein-to-calorie is the weak spot at 2 servings: 29 g for 650 calories, and the sauce is roughly 55% of those calories while contributing no protein. Going to 1 lb of turkey (with 1 whole egg and 1/2 cup panko) and leaving the sauce alone gets about 43 g protein for 790 — a better plate if these are dinner rather than a side."]}, {"name": "Turkey Italian Sausage", "category": "Poultry / bulk sausage", "serves": 8, "blurb": "Bulk sausage from lean ground turkey — salt-bound, rested overnight.", "subtitle": "Multipurpose bulk Italian sausage from 93/7 ground turkey. Makes 1 lb (about eight 2 oz portions). 15 min work, then a 12–24 hr rest.", "prep": ["Toast the fennel in a dry pan ~60 sec until fragrant, then crack coarsely", "Keep the turkey in the fridge until the moment you mix — cold meat binds, warm meat smears", "Weigh the salt if you can: kosher salt brands differ by almost 2x per teaspoon"], "ingredients": ["7 g (about 1 1/2 tsp Diamond Crystal) kosher salt", "2 tsp (4 g) fennel seed, toasted and cracked", "1 tsp (2 g) sweet paprika", "1 tsp (3 g) garlic powder", "3/4 tsp (1.5 g) coarse black pepper", "1/2 tsp (1 g) red pepper flakes (1 1/2 tsp for hot)", "1/2 tsp (1 g) dried oregano", "1 tsp (2 g) mushroom powder (optional)", "1 lb (454 g) ground turkey, 93/7, very cold", "3 Tbs (40 mL) olive oil", "2 Tbs (30 mL) ice water", "1 tsp (5 mL) red wine vinegar"], "steps": ["Toast the fennel seed in a dry pan about 60 seconds, until fragrant, then crack it coarsely.", "Combine the fennel with the salt, paprika, garlic powder, black pepper, red pepper flakes, oregano and mushroom powder in a small bowl.", "Scatter the spice mix over the cold ground turkey, then add the olive oil, ice water and red wine vinegar.", "Mix hard for 60 to 90 seconds, until the meat turns sticky and tacky and clings to the bowl. That stickiness is the bind — keep going until you see it.", "Cover and chill 12 to 24 hours. This is what turns seasoned ground turkey into sausage. If you need it tonight, see the no-rest note.", "Test-fry a teaspoon in a hot pan and adjust the salt or the heat before you commit the batch.", "Shape and cook: pinched raw onto pizza, formed into patties, crumbled into sauce, or rolled into meatballs. The notes have the specifics for each."], "grid": [{"ing": "7 g (about 1 1/2 tsp Diamond Crystal) kosher salt", "cells": [{"span": 8, "text": "combine in a\nsmall bowl"}, {"span": 12, "text": "mix hard\n60–90 sec\n\nuntil the meat\nturns sticky and\ntacky and clings\nto the bowl"}, {"span": 12, "text": "cover\n\nchill\n12–24 hr"}, {"span": 12, "text": "test-fry\na teaspoon\n\nadjust salt\nor heat"}, {"span": 12, "text": "shape\nand cook\n\npizza, patties,\ncrumble or\nmeatballs\n\n(see notes)"}]}, {"ing": "2 tsp (4 g) fennel seed, toasted and cracked", "cells": [null, null, null, null, null]}, {"ing": "1 tsp (2 g) sweet paprika", "cells": [null, null, null, null, null]}, {"ing": "1 tsp (3 g) garlic powder", "cells": [null, null, null, null, null]}, {"ing": "3/4 tsp (1.5 g) coarse black pepper", "cells": [null, null, null, null, null]}, {"ing": "1/2 tsp (1 g) red pepper flakes (1 1/2 tsp for hot)", "cells": [null, null, null, null, null]}, {"ing": "1/2 tsp (1 g) dried oregano", "cells": [null, null, null, null, null]}, {"ing": "1 tsp (2 g) mushroom powder (optional)", "cells": [null, null, null, null, null]}, {"ing": "1 lb (454 g) ground turkey, 93/7, very cold", "cells": [{"span": 1, "text": "scatter the\nspice mix over"}, null, null, null, null]}, {"ing": "3 Tbs (40 mL) olive oil", "cells": [{"span": 3, "text": "add"}, null, null, null, null]}, {"ing": "2 Tbs (30 mL) ice water", "cells": [null, null, null, null, null]}, {"ing": "1 tsp (5 mL) red wine vinegar", "cells": [null, null, null, null, null]}], "ncols": 5, "notes": ["The salt and the rest are the recipe. Mixing hard at 1.5% salt dissolves myosin into a sticky sol; the overnight chill lets it set. That is what turns ground turkey into sausage — cohesive, springy, holding its juice. Skip the rest and you have seasoned ground turkey that crumbles in the pan. Same mechanism as the paste bind in the shrimp burgers.", "Salt is structural here, not seasoning. Below roughly 1.2% by weight the bind does not happen and the texture collapses. 1.5% is 7 g per pound — about 2,700 mg sodium across the whole batch, or ~335 mg per 2 oz portion. That is at or slightly below commercial Italian sausage, which runs 390–450 mg for the same weight. The mushroom powder is there so you can drop to 1.3% (6 g) without it tasting flat; that is about as low as this goes before texture starts to suffer.", "93/7 turkey is the real constraint. A pound holds about 32 g of fat; pork sausage runs 25–30% fat, so roughly 115 g. No amount of seasoning closes that gap. The 3 Tbs of olive oil brings the mix to around 15% fat, which is the floor for something that does not read as dry. Do not skip it, and do not leave out the ice water either — it helps the lean protein hold moisture through cooking.", "Always test-fry. A teaspoon flattened in a hot pan tells you about salt and heat level before you have committed a pound of meat and a day of resting.", "NO-REST SHORTCUT. If you need it tonight, mix as written — hard, the mechanical work does most of the myosin extraction and the rest only lets it set — then freeze the bowl 15 min and use it. You get maybe half the texture benefit. That is fine for pizza, where the nuggets are loose anyway and the cheese holds them, and bad for patties or meatballs, which need the bind to hold shape. Bump the fennel and red pepper by about a quarter: unrested spice tastes weaker because it has not bloomed into the fat yet.", "FOR PIZZA: pinch the raw sausage into pea-to-marble nuggets and scatter them on the pie raw. Do not pre-cook it. At 500°F+ for 8–12 minutes the nuggets cook through, and the fat renders down into the cheese instead of into a skillet you then drain. Pre-browned sausage on a pizza gets cooked twice and tastes like it.", "PATTIES: four 4 oz patties, about 3 min per side in a hot pan, pulled at 160°F. CRUMBLE: brown and break up into tomato sauce, where the rendered fat is the point. MEATBALLS: roll 1 oz balls, sear and finish in sauce.", "NO-FENNEL VARIANT. Fennel is what makes this read as Italian sausage and there is no real substitute (caraway is the nearest common one). Without it, drop the fennel, paprika and oregano and use 2 tsp Italian seasoning crushed between your fingers, with the garlic powder up to 1 1/2 tsp and the red pepper to 3/4 tsp. Keep the blend to 2 tsp: most Italian seasoning carries rosemary, sage and thyme, which turn piney and drift toward breakfast sausage if you pour with a heavy hand. Call the result a garlic pizza sausage rather than an Italian one — it is good, it is just not the same thing.", "BREAKFAST VARIANT: swap the fennel and oregano for 1 1/2 tsp rubbed sage and 1/4 tsp nutmeg, and add 2 tsp maple syrup. Everything else stays.", "Keeps 3 days in the fridge after the rest and 3 months frozen. Portion it before freezing — a frozen brick of bulk sausage is useless on a weeknight.", "Cold meat, cold bowl, cold hands. If the fat warms and smears into the protein the texture goes pasty rather than springy. If the kitchen is warm, chill the bowl first and mix with a stiff spatula instead of your hands."]}, {"name": "Papas Rellenas", "category": "Potato / pan-fry", "serves": 4, "blurb": "Cheese-stuffed potato cakes with ham and cilantro.", "subtitle": "Cheese-stuffed potato cakes with ham and cilantro. Makes 8 cakes (4 servings of 2). 45 min plus a 30 min chill.", "prep": ["Squeeze the cheese into 8 tight pucks and freeze 30 min before you stuff — cold cheese melts slower and blows out less", "Line a sheet pan with parchment for the formed cakes"], "ingredients": ["2 lb (900 g) russet potatoes (about 4 medium), peeled, large chunks", "2 1/2 qt (2.4 L) cold water — enough to cover by 1 in", "1 Tbs (18 g) kosher salt, for the water", "1 tsp (5 g) kosher salt, for the mash", "1 large egg yolk (keep the white)", "1/4 cup (32 g) cornstarch", "1 tsp (2 g) mushroom powder", "1/2 tsp (1 g) white pepper", "1/3 cup (15 g) cilantro, chopped fine", "4 oz (115 g) diced ham, or cooked turkey sausage", "6 oz (170 g) low-moisture mozzarella, shredded (about 1 1/2 cups)", "2 Tbs (16 g) cornstarch, for dusting", "3–4 Tbs (45–60 mL) neutral oil, for frying"], "steps": ["Squeeze the shredded cheese into 8 tight pucks and freeze them 30 minutes. Line a sheet pan with parchment.", "Put the potato chunks in a pot with 2 1/2 qt of COLD water and the 1 Tbs of salt. Bring to a boil and cook 15 to 20 minutes, until a knife slides in easily. Starting cold is what keeps the edges from turning to mush.", "Drain, then return the potatoes to the dry hot pot for 1 to 2 minutes over low heat to steam off the water they just took on.", "Rice or mash them while hot. Never a food processor — it ruptures the starch and turns the mash to glue.", "Stir together the 1 tsp of salt, the egg yolk, cornstarch, mushroom powder and white pepper. Chop the cilantro and dice the ham.", "Fold everything into the potato just until combined. Do not overwork. Cool 30 minutes in the fridge — warm mash will not hold a seal.", "Oil your hands. Divide into 8 balls, press a deep well in each, seal a frozen cheese puck inside, then roll smooth and flatten to about 3/4 in. Check each one for cracks.", "Dust both sides with cornstarch.", "Fry in the oil over medium, 4 to 5 minutes per side, until deep gold. Drain on a rack."], "grid": [{"ing": "2 lb (900 g) russet potatoes (about 4 medium), peeled, large chunks", "cells": [{"span": 3, "text": "start in COLD\nwater, bring\nto a boil\n\n15–20 min until\na knife slides\nin easily"}, {"span": 3, "text": "drain\n\ndry in the hot pot\n1–2 min over\nlow heat\n\nrice or mash\n— never a\nprocessor"}, {"span": 10, "text": "fold together\njust until combined\n\ndo not fried in a few tablespoons of oil. Same family, different dish. Whatever else it is, it is not a pupusa: that is a masa (corn) dough, and the video has it wrong.", "WATER IS THE WHOLE PROBLEM, and the video skips all three fixes. Use russets, not waxy potatoes — high starch, low moisture. After draining, put the potatoes back in the dry hot pot for 1–2 minutes over low heat to steam off what boiling put in. And cool the mash completely before forming: warm mash is slack and will not hold a seal. Each of these costs you a minute and each one prevents a cake falling apart in the pan.", "HOW MUCH WATER: about 2 1/2 qt (2.4 L) for 900 g of chunks, enough to cover by an inch in a standard 4 qt pot. Start them in COLD water and bring it up together — chunks dropped into already-boiling water cook from the outside in, and the edges go to mush before the centers are done. The 1 Tbs of salt is roughly 0.7% of that volume; it looks like a lot because most of it goes down the drain.", "SAVE NONE OF THE COOKING WATER. Potato water is genuinely useful in bread or for thickening a soup, but this is the one dish where it is the enemy: the whole recipe is an argument for getting water out of the potato, and starchy water puts water and free starch back in. If the mash somehow comes out too dry to form — over-dried in the pot, or very old potatoes — fix it with a teaspoon of the egg white left over from the yolk, not with cooking water.", "Never a food processor, blender or stand mixer. Overworking ruptures the starch cells and releases amylopectin, and the mash turns to glue — irreversibly. A ricer is best, a hand masher is fine, and you stop the moment it comes together.", "FREEZE THE CHEESE — the single best trick here. Cold cheese melts slower, so the cake sets before the filling liquefies and blowouts mostly stop. With shredded cheese you have to compress it first: about 3 Tbs packed shreds per cake (3/4 oz / 21 g), squeezed hard in your palm into a 1 in disk, then frozen 30 min — longer than a cube needs, since a puck is less dense. Loose shreds have far more surface area than a cube, so they liquefy sooner, and they trap air pockets that turn to steam. Compressing fixes both.", "Cheese choice. A block beats bagged shreds, which are coated in cellulose and potato starch to keep them separate — that coating gives a grainier melt and a weaker pull, and nothing removes it (rinsing just adds the water you spent the whole recipe getting out). Low-moisture mozzarella or Oaxaca/quesillo either way. Fresh mozzarella is far too wet: it will burst the cake and steam the inside soggy.", "Cornstarch, not flour, and do not skip it. 1/4 cup per 2 lb of potato is about the floor for a dough that seals and holds. No gluten means a crisper cake and a cleaner potato flavor; flour makes it bready and dulls both.", "Medium heat, not high. The cheese needs time to melt through a 3/4 in cake. On high you get a dark crust around a cold center with an unmelted puck in it.", "Check every cake for cracks before it hits the pan. One crack is one blowout. Roll it smooth again and re-flatten.", "PROTEIN. As written this is about 220 cal and 10 g protein per cake, so a 2-cake serving runs roughly 440 cal / 20 g — carb-dominant for a main. Doubling the ham, or swapping in the bulk turkey sausage from the other tab, takes a serving to about 25 g for roughly 70 more calories.", "SODIUM — this is a salty dish by construction and there is no clean way around it. Potato absorbs a lot of salt and tastes obviously flat without it, while ham and cheese are both salt-delivery systems. Estimated at roughly 1,500 mg per 2-cake serving as written. The mash salt is already cut to 1 tsp on that account; the boiling-water salt mostly goes down the drain, so keep it. The real lever is the filling: homemade turkey sausage in place of deli ham puts that ~1,400 mg under your control.", "DIPPING SAUCE: 1/4 cup mayo, 1 Tbs ketchup, 1 tsp lime juice, 1/2 tsp smoked paprika, a pinch of cayenne. That is the pink sauce in the video.", "MAKE-AHEAD: formed cakes hold 24 hr covered in the fridge, or freeze them raw in a single layer on a sheet pan and then bag them. Fry from frozen over medium-low, adding about 3 minutes a side."]}]}

<script>
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const app = document.getElementById("app");

let DATA = { recipes: [] };
let tab = "steps";
let wake = null;

/* per-viewer conveniences only; never load-bearing */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function noteHtml(n) {
  const m = n.match(/^([A-Z][A-Z0-9 ,'\-]{3,}?)(\s*[—:.]\s*|\s+)(.*)$/s);
  if (m && m[1].trim().split(" ").length <= 6) {
    return `<b>${esc(m[1].trim())}</b>${esc(m[3])}`;
  }
  return esc(n);
}

function renderList() {
  app.innerHTML = "";
  app.append($(`<header>
    <h1>Recipe Book</h1>
    <p class="sub">${DATA.recipes.length} recipes, laid out as combination grids.</p>
  </header>`));
  const list = $(`<div class="list"></div>`);
  DATA.recipes.forEach(r => {
    const c = $(`<button class="card">
      <h2>${esc(r.name)}</h2>
      <p>${esc(r.blurb)}</p>
      <div class="meta">${esc(r.category)} &nbsp;·&nbsp; serves ${esc(r.serves)}</div>
    </button>`);
    c.onclick = () => { location.hash = slug(r.name); };
    list.append(c);
  });
  app.append(list);
}

function renderRecipe(r) {
  app.innerHTML = "";
  const back = $(`<button class="back">&larr; All recipes</button>`);
  back.onclick = () => { location.hash = ""; };
  app.append(back);

  app.append($(`<header style="padding-top:6px">
    <h1>${esc(r.name)}</h1>
    <p class="sub">${esc(r.subtitle)}</p>
    <div class="rmeta">
      <span class="pill">serves ${esc(r.serves)}</span>
      <span class="pill">${esc(r.steps.length)} steps</span>
      <span class="pill">${esc(r.ingredients.length)} ingredients</span>
    </div>
  </header>`));

  const names = { steps: "Steps", ings: "Ingredients", grid: "Grid", notes: "Notes" };
  const tabs = $(`<div class="tabs" role="tablist"></div>`);
  Object.keys(names).forEach(k => {
    const b = $(`<button class="tab" role="tab" aria-selected="${k === tab}">${names[k]}</button>`);
    b.onclick = () => { tab = k; renderRecipe(r); };
    tabs.append(b);
  });
  app.append(tabs);

  const pane = $(`<div class="pane"></div>`);
  app.append(pane);

  if (tab === "steps") {
    if (r.prep.length) {
      pane.append($(`<div class="prep"><h3>Before you start</h3><ul>${
        r.prep.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`));
    }
    const key = "done:" + slug(r.name);
    let done = store.get(key, []);
    const wrapEl = $(`<div class="steps"></div>`);
    r.steps.forEach((s, i) => {
      const on = done.includes(i);
      const el = $(`<button class="step${on ? " done" : ""}">
        <div class="num">${i + 1}</div>
        <div class="act">${esc(s)}</div>
      </button>`);
      el.onclick = () => {
        done = done.includes(i) ? done.filter(x => x !== i) : done.concat(i);
        store.set(key, done);
        el.classList.toggle("done");
      };
      wrapEl.append(el);
    });
    pane.append(wrapEl);

    const tools = $(`<div class="tools"></div>`);
    const reset = $(`<button class="tool">Clear checkmarks</button>`);
    reset.onclick = () => { store.set(key, []); renderRecipe(r); };
    tools.append(reset);
    if ("wakeLock" in navigator) {
      const w = $(`<button class="tool" aria-pressed="${!!wake}">Keep screen on</button>`);
      w.onclick = async () => {
        try {
          if (wake) { await wake.release(); wake = null; }
          else { wake = await navigator.wakeLock.request("screen"); wake.onrelease = () => { wake = null; }; }
          w.setAttribute("aria-pressed", !!wake);
        } catch (e) { w.textContent = "Screen lock unavailable"; w.disabled = true; }
      };
      tools.append(w);
    }
    pane.append(tools);
  }

  if (tab === "ings") {
    const key = "got:" + slug(r.name);
    let got = store.get(key, []);
    const ul = $(`<div class="ings"></div>`);
    r.ingredients.forEach((ing, i) => {
      const on = got.includes(i);
      const el = $(`<button class="ing${on ? " got" : ""}"><div class="box"></div><span>${esc(ing)}</span></button>`);
      el.onclick = () => {
        got = got.includes(i) ? got.filter(x => x !== i) : got.concat(i);
        store.set(key, got);
        el.classList.toggle("got");
      };
      ul.append(el);
    });
    pane.append(ul);
    const tools = $(`<div class="tools"></div>`);
    const reset = $(`<button class="tool">Clear checkmarks</button>`);
    reset.onclick = () => { store.set(key, []); renderRecipe(r); };
    tools.append(reset);
    pane.append(tools);
  }

  if (tab === "grid") {
    if (r.prep.length) {
      pane.append($(`<div class="prep"><h3>Before you start</h3><ul>${
        r.prep.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>`));
    }
    let html = "<table><tbody>";
    r.grid.forEach(row => {
      html += `<tr><td class="gi">${esc(row.ing)}</td>`;
      row.cells.forEach(c => {
        if (c === null) return;
        html += `<td class="gs"${c.span > 1 ? ` rowspan="${c.span}"` : ""}>${esc(c.text)}</td>`;
      });
      html += "</tr>";
    });
    html += "</tbody></table>";
    pane.append($(`<div class="scroller">${html}</div>`));
    pane.append($(`<p class="hint">The original combination grid. Scroll it sideways; the ingredient column stays put.</p>`));
  }

  if (tab === "notes") {
    pane.append($(`<div class="notes">${
      r.notes.map(n => `<div class="note">${noteHtml(n)}</div>`).join("")}</div>`));
  }
}

function route() {
  const h = location.hash.replace(/^#/, "");
  const r = DATA.recipes.find(x => slug(x.name) === h);
  if (r) { renderRecipe(r); window.scrollTo(0, 0); }
  else renderList();
}

DATA = JSON.parse(document.getElementById("recipe-data").textContent);
route();

window.addEventListener("hashchange", () => { tab = "steps"; route(); });
</script>
</body>
</html>
